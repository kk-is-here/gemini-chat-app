<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gemini Real-Time Voice Call</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0f172a; color: white; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        button { padding: 12px 24px; font-size: 18px; font-weight: bold; border-radius: 50px; border: none; cursor: pointer; transition: 0.2s; }
        .start-btn { background: #22c55e; color: white; }
        .stop-btn { background: #ef4444; color: white; }
        #status { margin-top: 15px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎙️ Voice Assistant Call</h2>
        <button id="callBtn" class="start-btn" onclick="toggleCall()">Start Call</button>
        <p id="status">Status: Disconnected</p>
    </div>

    <script>
        let isCalling = false;
        let ws = null;
        let audioContext = null;
        let micStream = null;
        let processor = null;

        async function toggleCall() {
            const btn = document.getElementById("callBtn");
            const status = document.getElementById("status");

            if (!isCalling) {
                // 1. Initialize Audio Context (Input: 16kHz, Output: 24kHz)
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                const playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });

                // 2. Open WebSocket to Python Server
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(`${protocol}//${window.location.host}/ws/chat`);

                ws.onopen = async () => {
                    status.innerText = "Status: Connected (Speak now)";
                    btn.innerText = "End Call";
                    btn.className = "stop-btn";
                    isCalling = true;

                    // 3. Capture Microphone
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const source = audioContext.createMediaStreamSource(micStream);
                    processor = audioContext.createScriptProcessor(4096, 1, 1);

                    processor.onaudioprocess = (e) => {
                        if (!isCalling) return;
                        const inputData = e.inputBuffer.getChannelData(0);
                        
                        // Convert Float32 array to 16-bit PCM buffer
                        const pcm16 = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                        }

                        // Send base64 PCM chunk to server
                        const base64Audio = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
                        ws.send(JSON.stringify({ audio: base64Audio }));
                    };

                    source.connect(processor);
                    processor.connect(audioContext.destination);
                };

                ws.onmessage = async (event) => {
                    const data = JSON.parse(event.data);
                    if (data.audio) {
                        // Playback 24kHz native audio chunk from Gemini
                        const binaryStr = atob(data.audio);
                        const len = binaryStr.length;
                        const bytes = new Uint8Array(len);
                        for (let i = 0; i < len; i++) bytes[i] = binaryStr.charCodeAt(i);

                        const int16Array = new Int16Array(bytes.buffer);
                        const float32Array = new Float32Array(int16Array.length);
                        for (let i = 0; i < int16Array.length; i++) {
                            float32Array[i] = int16Array[i] / 32768.0;
                        }

                        const audioBuffer = playbackContext.createBuffer(1, float32Array.length, 24000);
                        audioBuffer.getChannelData(0).set(float32Array);
                        const bufferSource = playbackContext.createBufferSource();
                        bufferSource.buffer = audioBuffer;
                        bufferSource.connect(playbackContext.destination);
                        bufferSource.start();
                    }
                };

                ws.onclose = () => stopCall();

            } else {
                stopCall();
            }
        }

        function stopCall() {
            isCalling = false;
            if (ws) ws.close();
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (audioContext) audioContext.close();
            
            document.getElementById("callBtn").innerText = "Start Call";
            document.getElementById("callBtn").className = "start-btn";
            document.getElementById("status").innerText = "Status: Disconnected";
        }
    </script>
</body>
</html>
